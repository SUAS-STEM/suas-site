name: Build Pi deployment artifact

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suas-pi-build-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone server
        env:
          GITHUB_TOKEN: ${{ secrets.SUAS_INTERNAL_TOKEN }}
        run: npm run build
      - name: Validate standalone output
        run: |
          test -s .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
      - name: Upload Pi artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-standalone
          path: .next/standalone
          if-no-files-found: error
          retention-days: 14
