services:
  suas-site:
    build:
      context: .
      secrets:
        - github_token
    image: suas-site:latest
    container_name: suas-site
    restart: unless-stopped
    user: "0:0"
    command: ["/usr/local/bin/suas-site-entrypoint"]
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
      # Reuse the existing SUAS admin password/session mechanism. This file
      # contains the long-standing dev-auth settings.
      - /home/pi/suas-site-dev/.env.local
    volumes:
      - ./deploy/production-entrypoint.sh:/usr/local/bin/suas-site-entrypoint:ro
      - suas_next_cache:/app/.next/cache
      - suas_data:/data
      - /home/pi/suas-status:/run/suas-status:ro

secrets:
  github_token:
    file: ./.secrets/github_token

volumes:
  suas_next_cache:
  suas_data:
