services:
  suas-site:
    build:
      context: .
      secrets:
        - github_token
    image: suas-site:latest
    container_name: suas-site
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
      # Reuse the existing SUAS admin password/session mechanism. This file
      # contains the long-standing dev-auth settings.
      - /home/pi/suas-site-dev/.env.local
    volumes:
      - suas_data:/data
      - /home/pi/suas-status:/run/suas-status:ro

secrets:
  github_token:
    file: ./.secrets/github_token

volumes:
  suas_data:
